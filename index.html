<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triades majeures — montée et descente chromatiques</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17212d;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:30px 18px}.wrap{max-width:1000px;margin:auto;text-align:center}h1{font-size:clamp(1.5rem,3vw,2.2rem);margin:20px 0 8px}p{color:#536170;line-height:1.5}.card{background:white;border:1px solid #dce3e9;border-radius:18px;padding:26px 20px;margin:24px 0;box-shadow:0 6px 22px #1b35500b}.score{width:100%;height:auto;display:block;margin:20px auto}.note{font-size:clamp(3rem,9vw,6rem);font-weight:700;min-height:1.35em;display:grid;place-items:center}.muted{font-size:.95rem;color:#64748b}.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-weight:650;margin:12px}.track{height:9px;background:#e7edf3;border-radius:20px;overflow:hidden;max-width:450px;margin:10px auto 25px}.fill{height:100%;width:0;background:#2463b7;transition:width .08s linear}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{border:0;border-radius:10px;padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;background:#2463b7;color:white}button.secondary{background:#e4eaf1;color:#17212d}button:disabled{opacity:.45;cursor:not-allowed}label{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}input{width:90px;font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:8px}.hidden{display:none}.progress{font-size:.9rem;color:#64748b;margin:12px} .stage{font-size:1.05rem;font-weight:600;color:#475569}</style></head><body><main class="wrap"><h1>Triades majeures — chromatisme</h1><p>Jouer les 12 triades majeures à partir de do, en montant chromatiquement jusqu'à l'octave, puis en redescendant.</p><div class="card"><div id="intro"><img class="score" src="modele.png" alt="Modèle noté de l'enchaînement chromatique des triades majeures"><p>Effectuer cet enchaînement en respectant l'ordre chromatique.</p></div><div id="exercise" class="hidden" aria-live="polite"><div id="stage" class="stage"></div><div id="note" class="note">Do</div><div id="progress" class="progress"></div></div><div class="track"><div class="fill" id="fill"></div></div><div class="controls"><button id="start">Démarrer</button><button class="secondary" id="pause" disabled>Pause</button><button class="secondary" id="restart">Recommencer</button></div><label>Durée par accord : <input type="number" id="duration" min="1" max="60" step="0.5" value="4.5"> secondes</label><p class="muted">Montée : Do → Do♯ → Ré → … → Si → Do ; descente : Si → Si♭ → … → Ré♭ → Do.</p></div></main><script>
(()=>{const up=['Do','Do♯','Ré','Mi♭','Mi','Fa','Fa♯','Sol','La♭','La','Si♭','Si','Do'];const down=['Si','Si♭','La','La♭','Sol','Fa♯','Fa','Mi','Mi♭','Ré','Ré♭','Do'];const seq=[...up,...down];const $=id=>document.getElementById(id);let idx=0,elapsed=0,last=0,raf=0,running=false,started=false;function seconds(){return Math.max(1,Math.min(60,Number($('duration').value)||4.5))}function render(){let s=seconds();$('fill').style.width=Math.min(100,elapsed/s*100)+'%';if(started){$('note').textContent=idx>=seq.length?'Terminé !':seq[idx];$('stage').textContent=idx>=seq.length?'Enchaînement terminé':idx<up.length?'Montée chromatique':'Descente chromatique';$('progress').textContent=idx>=seq.length?`${seq.length} / ${seq.length}`:`Accord ${idx+1} / ${seq.length}`}}function tick(now){if(!running)return;elapsed+=(now-last)/1000;last=now;let s=seconds();while(elapsed>=s&&idx<seq.length){elapsed-=s;idx++}if(idx>=seq.length){running=false;elapsed=0;$('pause').disabled=true;$('start').disabled=false;$('start').textContent='Recommencer';}render();if(running)raf=requestAnimationFrame(tick)}function begin(){if(idx>=seq.length){idx=0;elapsed=0}started=true;$('intro').classList.add('hidden');$('exercise').classList.remove('hidden');running=true;last=performance.now();$('start').disabled=true;$('pause').disabled=false;$('pause').textContent='Pause';render();raf=requestAnimationFrame(tick)}$('start').addEventListener('click',begin);$('pause').addEventListener('click',()=>{if(running){running=false;cancelAnimationFrame(raf);$('pause').textContent='Reprendre'}else{running=true;last=performance.now();$('pause').textContent='Pause';raf=requestAnimationFrame(tick)}});$('restart').addEventListener('click',()=>{running=false;cancelAnimationFrame(raf);started=false;idx=0;elapsed=0;$('intro').classList.remove('hidden');$('exercise').classList.add('hidden');$('start').disabled=false;$('start').textContent='Démarrer';$('pause').disabled=true;$('pause').textContent='Pause';render()});$('duration').addEventListener('change',()=>{$('duration').value=seconds();render()});render()})();
</script></body></html>
